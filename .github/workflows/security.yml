name: Seguridad

# Auditoría de dependencias (pip-audit, npm audit) y escaneo dinámico OWASP ZAP (F-62).
on:
  push:
    branches: [main]
    paths: ["backend/requirements*.txt", "frontend/package*.json", "e2e/package*.json", ".github/workflows/security.yml"]
  pull_request:
    paths: ["backend/requirements*.txt", "frontend/package*.json", "e2e/package*.json", ".github/workflows/security.yml"]
  schedule:
    - cron: "17 9 * * 1" # lunes, las vulnerabilidades nuevas aparecen aunque el código no cambie
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Dependencias de producción y de desarrollo
        run: pip-audit -r backend/requirements-dev.txt --strict

  npm-audit:
    name: npm audit (Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        project: [frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Vulnerabilidades altas o críticas (falla el job)
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.project }}
      - name: Informe completo (no falla)
        if: always()
        run: npm audit || true
        working-directory: ${{ matrix.project }}

  zap-api:
    name: OWASP ZAP · escaneo de la API (autenticado)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: zap-scan-only-secret-key-not-used-anywhere-else-0123456789abcdef
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: https://ejemplo.cl
      SECURE_SSL_REDIRECT: "false" # el TLS lo termina Nginx en producción; aquí se escanean cabeceras y lógica
      ENABLE_API_DOCS: "true"
      DATABASE_URL: sqlite:////tmp/zap.sqlite3
      # El escáner dispara miles de peticiones desde una IP: sin esto solo mediría el límite de peticiones (429).
      THROTTLE_RATE_ANON: 100000/min
      THROTTLE_RATE_USER: 100000/min
      THROTTLE_RATE_LOGIN: 100000/min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Levantar backend con datos demo (base desechable)
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          nohup gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 > /tmp/gunicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health/ && break; sleep 2; done
      - name: Token del usuario demo (para escanear endpoints protegidos)
        id: token
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login/ \
            -H 'Content-Type: application/json' -d '{"username":"huesped","password":"demo1234"}' \
            | python -c "import sys,json; print(json.load(sys.stdin)['access'])")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: ZAP API scan (OpenAPI)
        env:
          ZAP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          mkdir -p zap && chmod 777 zap
          set +e
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER=Authorization -e ZAP_AUTH_HEADER_VALUE="Bearer $ZAP_TOKEN" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://127.0.0.1:8000/api/schema/ -f openapi -O http://127.0.0.1:8000 \
            -r zap-api-report.html -J zap-api-report.json
          code=$?
          echo "ZAP terminó con código $code (0 = sin hallazgos, 1 = FALLAS, 2 = avisos, otro = error de ejecución)"
          # Avisos (2) no rompen el job: se revisan en el informe. Fallas (1) o errores de ejecución sí.
          if [ "$code" -eq 1 ] || [ "$code" -ge 3 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-api-report
          path: zap
          retention-days: 30

  zap-baseline:
    name: OWASP ZAP · escaneo pasivo del sitio desplegado
    # Solo si se define la variable de repositorio ZAP_TARGET_URL (p. ej. https://wexperiencias.cl)
    if: ${{ vars.ZAP_TARGET_URL != '' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: |
          mkdir -p zap && chmod 777 zap
          set +e
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ vars.ZAP_TARGET_URL }}" -r zap-baseline-report.html -J zap-baseline-report.json
          code=$?
          if [ "$code" -eq 1 ] || [ "$code" -ge 3 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap
          retention-days: 30
