name: Desplegar a AWS

# Despliega a la instancia EC2 por AWS Systems Manager (sin SSH ni claves guardadas: GitHub asume un rol por OIDC).
# - Al publicar una etiqueta  v*  (ej. v1.0.0)
# - O manualmente (Actions → "Desplegar a AWS" → Run workflow) indicando rama o etiqueta.
# Requiere el entorno "production" en GitHub (con aprobación manual recomendada) y, en él:
#   secreto  AWS_DEPLOY_ROLE_ARN   (salida DeployRoleArn de infra/aws/wexperiencias.yml)
#   variables AWS_REGION · AWS_INSTANCE_ID · SITE_DOMAIN
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o etiqueta a desplegar"
        required: true
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Pruebas previas
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Desplegar
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Validar la referencia
        run: |
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Referencia inválida: $REF"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Ejecutar deploy.sh en el servidor
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          CMD="export HOME=/root; cd /opt/wexperiencias && REF='$REF' ./deploy/scripts/deploy.sh"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Despliegue $REF (run ${{ github.run_id }})" \
            --timeout-seconds 1800 \
            --parameters "$(jq -nc --arg c "$CMD" '{commands: [$c]}')" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $CMD_ID"
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Estado:Status,Salida:StandardOutputContent,Errores:StandardErrorContent}' --output yaml
          [ "$STATUS" = "Success" ]
      - name: Comprobar el sitio publicado
        run: |
          for i in $(seq 1 12); do
            curl -fsS "https://${{ vars.SITE_DOMAIN }}/api/v1/health/" && exit 0
            sleep 10
          done
          exit 1
