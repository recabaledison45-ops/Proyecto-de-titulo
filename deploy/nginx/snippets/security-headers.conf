# Cabeceras de seguridad. Se incluye a nivel de "server"; los "location" NO deben usar add_header
# (Nginx descarta las cabeceras heredadas si un location define las suyas). Para caché use "expires".
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP: scripts solo propios. Imágenes https: porque los anfitriones pueden pegar la URL de su foto.
# Si cambia de proveedor de teselas, agregue su dominio en img-src (y connect-src si usa vectores).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
