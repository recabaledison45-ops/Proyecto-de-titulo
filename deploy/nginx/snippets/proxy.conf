# Parámetros comunes de proxy hacia Django (gunicorn).
proxy_pass http://backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Se SOBRESCRIBE (no se concatena): el cliente no puede falsificar su IP. Django usa NUM_PROXIES=1.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;

# Las cabeceras de seguridad las pone Nginx una sola vez (ver security-headers.conf): se descartan las de Django.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
